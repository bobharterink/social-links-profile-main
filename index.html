<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preload" href="./assets/fonts/inter-v20-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/inter-v20-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/inter-v20-latin-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Social links profile</title>

<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="main">
    <article class="card">
    <figure>
      <img src="./assets/images/avatar-jessica.jpeg" alt="" class="card__avatar" height="176" width="176">
      <figcaption>
        <h1 class="card__title">Jessica Randall</h1>
        <address class="card__location">London, United Kingdom</address>
        <p class="card__bio">"Front-end developer and avid reader."</p>
      </figcaption>
    </figure>
      
      <ul class="card__links">
        <li><a href="https://github.com/jessicarandall" class="card__button">GitHub</a></li>
        <li><a href="https://www.frontendmentor.io/profile/jessicarandall" class="card__button">Frontend Mentor</a></li>
        <li><a href="https://www.linkedin.com/in/jessicarandall" class="card__button">LinkedIn</a></li>
        <li><a href="https://twitter.com/jessicarandall" class="card__button">Twitter</a></li>
        <li><a href="https://www.instagram.com/jessicarandall" class="card__button">Instagram</a></li>
      </ul>
    </article>
  </main>
</body>
</html>
