<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    body {
      background-color: hsl(0, 0%, 8%);
      font-family: 'Inter', sans-serif;
      color: hsl(0, 0%, 100%);
      margin: 0px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    h1, p {
      margin: 0px;
    }
    main {
      background-color: hsl(0, 0%, 12%);
      border-radius: 15px;
      text-align: center;
      width: 18.75rem;
      padding: 40px;
      margin: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 30px;
    }
    h1.card-name {
      font-size: 24px;
      font-weight: 600;   
    }
    p.card-location {
      font-size: 0.875rem;
      color: hsl(75, 94%, 57%);
      margin: 10px 0;
    }
    p.card-bio {
      font-size: 0.875rem;
      margin: 20px 0;
    }
    .card-button {
      background-color: hsl(0, 0%, 20%);
      color: hsl(0, 0%, 100%);
      border: none;
      border-radius: 10px;
      padding: 15px 20px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      align-self: stretch;
      transition: all ease-in-out .3s;
      margin: 7px 0;
    }
    .card-button:hover {
      background-color: hsl(75, 94%, 57%);
      color: hsl(0, 0%, 20%);
    }
  </style>
</head>
<body>
  <main>
      <img class="card-avatar" src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall's profile picture">
      <h1 class="card-name">Jessica Randall</h1>
      <p class="card-location">London, United Kingdom</p>
      <p class="card-bio">"Front-end developer and avid reader."</p>
      <button class="card-button">GitHub</button>
      <button class="card-button">Frontend Mentor</button>
      <button class="card-button">LinkedIn</button>
      <button class="card-button">Twitter</button>
      <button class="card-button">Instagram</button>
  </main>
</body>
</html>
